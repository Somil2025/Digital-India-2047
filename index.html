<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question ❤️</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #ffeef2;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* Prevents scrollbars when button moves */
            margin: 0;
        }

        #main-card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            width: 400px;
            z-index: 10;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #ff4d6d;
            font-size: 3rem;
            margin-bottom: 2rem;
        }

        .btn-container {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 100px;
            align-items: center;
        }

        #btn-yes {
            transition: transform 0.3s ease;
            z-index: 100;
        }

        #btn-no {
            position: absolute;
            transition: all 0.2s ease;
            z-index: 100;
            white-space: nowrap;
        }

        #celebration {
            display: none;
            text-align: center;
        }

        #celebration img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .success-text {
            font-family: 'Dancing Script', cursive;
            color: #ff4d6d;
            font-size: 2.5rem;
        }
    </style>
</head>
<body>

    <div id="main-card">
        <div id="question-section">
            <h1 id="headline">Will you be my valentine?</h1>
            <div class="btn-container">
                <button id="btn-yes" class="btn btn-success btn-lg px-4">Yes</button>
                <button id="btn-no" class="btn btn-danger btn-lg px-4">No</button>
            </div>
        </div>

        <div id="celebration">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHIycXp5OHR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZzR4ZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/l41lTfuxV6M0S19eM/giphy.gif" alt="Celebration Cat">
            <h2 class="success-text">Now you are Somil's valentine! ❤️</h2>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const questionSection = document.getElementById('question-section');
        const celebrationSection = document.getElementById('celebration');
        const headline = document.getElementById('headline');

        let moveCount = 0;
        let yesScale = 1;

        const moveButton = () => {
            // Calculate random positions
            // Subtracting button dimensions to keep it in view
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;

            // Make the Yes button bigger every time they try to click No
            moveCount++;
            yesScale += 0.15;
            btnYes.style.transform = `scale(${yesScale})`;

            // Add some "weird" text changes
            if(moveCount === 2) btnNo.innerText = "Are you sure?";
            if(moveCount === 4) btnNo.innerText = "Wait, stop!";
            if(moveCount === 6) btnNo.innerText = "Wrong button lol";
            if(moveCount === 10) btnNo.innerText = "Just click Yes already";
        };

        // Handle both Mouse (Desktop) and Touch (Mobile)
        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents clicking on mobile
            moveButton();
        });

        btnYes.addEventListener('click', () => {
            questionSection.style.display = 'none';
            celebrationSection.style.display = 'block';
            
            // Extra touch: change background color
            document.body.style.backgroundColor = '#ffcad4';
        });
    </script>
</body>
</html>
